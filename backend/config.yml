model:
  type: "legacy"                  # or "x3d_m" for future upgrade
  confidence_threshold: 0.75
  frame_window_size: 32           # STRICT: never change this
  device: "cuda"                  # auto-fallback to cpu
  stride: 16

fusion:
  enabled: true
  violence_weight: 0.65
  motion_weight: 0.20
  weapon_weight: 0.15
  weapon_threshold: 0.55
  weapon_boost: 0.12

notifications:
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""
    min_severity: "high"

database:
  path: "./sentinel.db"

storage:
  thumbnails_dir: "./thumbnails"
  evidence_dir: "./evidence_clips"
  reports_dir: "./reports"
  evidence_ledger_path: "./evidence_ledger.jsonl"

security:
  api_key: ""
  audit_log_path: "./audit_logs.jsonl"

audio:
  enabled: false
  scream_threshold: 0.55
  loudness_threshold: 0.40

server:
  host: "0.0.0.0"
  port: 8000
  cors_origins: ["*"]
