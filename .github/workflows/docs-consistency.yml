name: Documentation consistency
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check canonical docs and design source
        run: python3 scripts/docs_contract.py --check-design
      - name: Test documentation guard
        run: python3 -m unittest discover -s tests/docs_contract -p "test_*.py"
